source:
  root_dir: "D:/meteo/datasets"
  directory_template: ""
  file_pattern: "*.nc"

batch:
  lookback_hours: 12

output:
  root_dir: "D:/meteo/output"
  model_code: "CPEFS"

state:
  directory: "state"
  filename_template: "processed_{YYYYMMDD}.json"
  retention_days: 30

plot:
  title_prefix: "TJCM"
  extent: [107.48, 123.5, 32.98, 47.02]
  latitude: "lat"
  longitude: "lon"
  level: "level"

boundaries:
  country_file: "shapefile/gadm36_CHN_0.shp"
  province_file: "shapefile/gadm36_CHN_1.shp"
  city_file: "shapefile/gadm36_CHN_2.shp"
  district_file: "shapefile/gadm36_CHN_3.shp"
  country_linewidth: 2.0
  province_linewidth: 1.8
  city_linewidth: 0.45
  district_linewidth: 0.45

# 公共颜色模板。十六进制颜色必须使用引号，避免被 YAML 当作注释。
