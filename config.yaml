variables:
  - name: "Tc"
    dimension: "3D"
    product: "SYNOPTIC"
    var_code: "TEMP"
    display_name: "温度"
    plot_unit: "°C"
    color_template: "scale5"
    color_mode: "interval"
    boundaries: [-50, -40, -35, -30, -25, -20, -15, -10, -5, 0, 5, 10, 15]
    invalid_values: []

  - name: "dbz"
    dimension: "3D"
    product: "MICRO"
    var_code: "DBZ"
    display_name: "雷达反射率"
    plot_unit: "dBZ"
    color_template: "scale3"
    color_mode: "threshold"
    levels: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70]
    invalid_values: []

  - name: "qcloud"
    dimension: "3D"
    product: "MICRO"
    var_code: "QCLOUD"
    display_name: "云水比含水量"
    plot_unit: "g/kg"
    color_template: "scale4"
    color_mode: "threshold"
    levels: [0.001, 0.01, 0.05, 0.1, 0.3, 0.5, 0.7, 1, 1.5, 2, 2.5, 3, 4, 5]
    invalid_values: []

  - name: "qrain"
    dimension: "3D"
    product: "MICRO"
    var_code: "QRAIN"
    display_name: "雨水比含水量"
    plot_unit: "g/kg"
    color_template: "scale4"
    color_mode: "threshold"
    levels: [0.001, 0.01, 0.05, 0.1, 0.3, 0.5, 0.7, 1, 1.5, 2, 2.5, 3, 4, 5]
    invalid_values: []

  - name: "qice"
    dimension: "3D"
    product: "MICRO"
    var_code: "QICE"
    display_name: "冰晶比含水量"
    plot_unit: "g/kg"
