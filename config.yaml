    levels: [0.001, 0.01, 0.05, 0.1, 0.3, 0.5, 0.7, 1, 1.5, 2, 2.5, 3, 4, 5]
    invalid_values: []

  - name: "qsnow"
    dimension: "3D"
    product: "MICRO"
    var_code: "QSNOW"
    display_name: "雪比含水量"
    plot_unit: "g/kg"
